services:
  loci-enterprise:
    build: .
    image: loci-enterprise:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8971:8971"
    volumes:
      - loci-data:/data
    environment:
      # Keys are created with `docker compose run --rm loci-enterprise key issue ...`
      LE_ALLOW_ANONYMOUS: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8971/health',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  loci-data:
