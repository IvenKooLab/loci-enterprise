name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      # Separate from pytest on purpose: if this step alone goes red, the
      # *claim* moved, and the README argument needs rewriting — not the code.
      - name: Incident still reproduces
        run: python scripts/demo_gate.py

  package:
    name: package + console entry point
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build a wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install the wheel into a clean venv (no source tree on the path)
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl

      - name: The wheel ships the console script and the demo
        run: |
          /tmp/venv/bin/le --help
          /tmp/venv/bin/le demo > /tmp/demo.txt
          tail -5 /tmp/demo.txt

      # Same gate, different interpreter: proves the packaged artifact, not
      # just the checkout, still tells the story.
      - name: Packaged gate
        run: /tmp/venv/bin/python scripts/demo_gate.py

      - name: No stray dependencies crept in
        run: |
          /tmp/venv/bin/python - <<'PY'
          import importlib.metadata as m
          deps = m.requires("loci-enterprise") or []
          runtime = [d for d in deps if "extra ==" not in d]
          print("runtime deps:", runtime or "none")
          assert not runtime, f"runtime dependencies are not allowed: {runtime}"
          PY
