[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loci-enterprise"
version = "0.1.0"
description = "Retrieval-quality-governed knowledge base: lifecycle, multi-writer governance, drift monitoring and a feedback loop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "loci-enterprise contributors" }]
keywords = ["rag", "knowledge-base", "governance", "retrieval", "observability", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# No runtime dependencies on purpose: the governance layer must be auditable,
# and a supply chain you cannot read is not auditable. Providers use urllib.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
le = "loci_enterprise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
